name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Flutter
        uses: subosito/flutter-action@v2
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
      - name: Create Gradle wrapper
        run: |
          cd android
          gradle wrapper
      - name: Build APK
        run: |
          cd android
          ./gradlew build