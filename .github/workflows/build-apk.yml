name: Build Mahani Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Gradle Wrapper
        working-directory: server/projects/mahani_app_1786954758949
        run: |
          echo "=== GRADLE WRAPPER ==="
          pwd
          ls -la android/gradlew
          file android/gradlew
          test -f android/gradlew
          test -x android/gradlew
          ./android/gradlew --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        working-directory: server/projects/mahani_app_1786954758949
        run: flutter pub get

      - name: Analyze
        working-directory: server/projects/mahani_app_1786954758949
        run: flutter analyze

      - name: Build Release APK
        working-directory: server/projects/mahani_app_1786954758949
        run: flutter build apk --release

      - name: Show APK
        working-directory: server/projects/mahani_app_1786954758949
        run: |
          ls -lh build/app/outputs/flutter-apk/
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahani-app-release
          path: server/projects/mahani_app_1786954758949/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
