name: Mahani Builder - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          dart --version

      - name: Verify generated Flutter project
        working-directory: server/projects/android_fix_test2
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          echo "Flutter project detected"
          echo "Dart files:"
          find lib -type f -name "*.dart" | sort

      - name: Get dependencies
        working-directory: server/projects/android_fix_test2
        run: flutter pub get

      - name: Analyze project
        working-directory: server/projects/android_fix_test2
        run: flutter analyze

      - name: Build release APK
        working-directory: server/projects/android_fix_test2
        run: flutter build apk --release

      - name: Verify APK
        working-directory: server/projects/android_fix_test2
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahani_app-apk
          path: server/projects/android_fix_test2/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
