name: Validate Mahani Builder

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax-check server and API
        run: |
          node --check server/index.js
          node --check server/professional-engine.js
          node --check server/github-actions.js
          node --check api/build-apk.js
      - name: Run project tests
        run: npm test
