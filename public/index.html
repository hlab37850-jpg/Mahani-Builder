<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahani Builder AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
}
.container{
  max-width:800px;
  margin:60px auto;
  padding:25px;
}
.card{
  background:#1e293b;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 50px #0005;
}
h1{
  margin-top:0;
  font-size:32px;
}
p{color:#cbd5e1}
input,textarea,select{
  width:100%;
  margin-top:8px;
  margin-bottom:18px;
  padding:14px;
  border:1px solid #475569;
  border-radius:12px;
  background:#0f172a;
  color:#fff;
  font-size:16px;
}
textarea{min-height:140px;resize:vertical}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#2563eb;
  color:white;
  font-size:17px;
  font-weight:bold;
}
button:active{transform:scale(.98)}
#result{
  margin-top:20px;
  white-space:pre-wrap;
  color:#93c5fd;
}
</style>
</head>

<body>
<div class="container">
  <div class="card">
    <h1>🚀 Mahani Builder AI</h1>
    <p>حوّل فكرتك إلى تطبيق حقيقي بالذكاء الاصطناعي.</p>

    <form id="projectForm">

      <label>اسم التطبيق</label>
      <input id="appName" placeholder="مثال: مدير المصاريف" required>

      <label>فكرة التطبيق</label>
      <textarea id="idea" placeholder="اكتب فكرة التطبيق بالتفصيل..." required></textarea>

      <label>نوع التطبيق</label>
      <select id="appType">
        <option>تطبيق عام</option>
        <option>متجر إلكتروني</option>
        <option>مطعم</option>
        <option>حجوزات</option>
        <option>تعليمي</option>
        <option>محاسبة</option>
      </select>

      <label>التصميم</label>
      <textarea id="design" placeholder="مثال: تصميم حديث، عربي RTL، ألوان احترافية"></textarea>

      <button type="submit">🧠 تحليل وإنشاء المشروع</button>

    </form>

    <pre id="result"></pre>
  </div>
</div>

<script>
document.getElementById('projectForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const result = document.getElementById('result');
  result.textContent = '⏳ جاري إرسال المشروع...';

  try {
    const response = await fetch('/api/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        appName:document.getElementById('appName').value,
        idea:document.getElementById('idea').value,
        appType:document.getElementById('appType').value,
        design:document.getElementById('design').value
      })
    });

    const data = await response.json();
    result.textContent = JSON.stringify(data,null,2);

  } catch(error) {
    result.textContent = '❌ تعذر الاتصال بالخادم';
  }
});
</script>

</body>
</html>
